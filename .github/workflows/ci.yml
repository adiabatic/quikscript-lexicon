name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y hunspell
      - uses: actions/setup-node@v4
        with:
          node-version-file: editor/server/package.json
          cache: npm
          cache-dependency-path: editor/server/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make check
