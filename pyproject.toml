[project]
name = "qslex"
version = "0.1.0"
description = "IPA-to-Quikscript segment mapping and tokenizer for the Quikscript lexicon"
authors = [
    { name = "Nathan Galt", email = "adiabatic@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
